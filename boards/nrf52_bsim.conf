# Simulated tracker (BabbleSim, tools/bsim). No SAADC/PWM/WDT/RTT models on nrf52_bsim.
CONFIG_EMUL=y
CONFIG_SPI=y
CONFIG_SPI_EMUL=y
CONFIG_I2C=y
CONFIG_I2C_EMUL=y
CONFIG_TASK_WDT=n
CONFIG_WATCHDOG=n
CONFIG_ADC=n
CONFIG_PWM=n
CONFIG_USE_SEGGER_RTT=n
